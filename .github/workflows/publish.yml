name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      stage_only:
        description: 'Stage release for manual 2FA approval (`npm stage publish`) instead of immediate publish'
        type: boolean
        default: false
      dry_run:
        description: 'Run full verification & npm publish --dry-run without publishing'
        type: boolean
        default: false

# Least-privilege default; `id-token: write` is granted ONLY to the `publish` job.
permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: '.node-version'
          cache: false
          run-install: true

      - name: Require a version tag for publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Select a version tag to publish, or choose dry_run."
          exit 1

      - name: Verify Git Tag Matches package.json Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "Tag version:     $TAG_VER"
          echo "package.json:    $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match package.json ($PKG_VER)"
            exit 1
          fi

      - name: Format, Lint & TypeScript 7 Check
        run: vp check

      - name: Node Unit & SSR Tests
        run: vp test --project=node

      - name: Install Playwright Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Real-Chromium Browser Mode Tests
        run: vp test --project=browser

      - name: Pack & Verify Tarball
        run: |
          vp pack
          npm pack --dry-run
          npm run test:package

  publish:
    name: Publish Package (OIDC Trusted Publishing)
    needs: verify
    runs-on: ubuntu-latest
    # Configure this protected GitHub Environment with required reviewer approval
    # and match its exact name in npmjs.com -> Package Settings -> Trusted Publisher.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Never enable dependency caching in release builds (supply-chain hardening)
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: '.node-version'
          cache: false
          run-install: true

      - name: Ensure npm CLI Supports OIDC Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e "
            const { execSync } = require('node:child_process');
            const v = execSync('npm --version').toString().trim().split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5)) {
              console.error('npm >= 11.5.1 is required for OIDC Trusted Publishing; got ' + v.join('.'));
              process.exit(1);
            }
          "

      - name: Build Clean Production Library Output
        run: vp pack

      - name: Determine npm Dist-Tag
        id: dist_tag
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VER" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish via OIDC + Automatic SLSA Provenance
        run: |
          TAG="${{ steps.dist_tag.outputs.tag }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running dry-run publish (dist-tag: $TAG)..."
            npm publish --dry-run --provenance --access public --tag "$TAG"
          elif [ "${{ inputs.stage_only }}" = "true" ]; then
            echo "Staging publish for manual 2FA approval (dist-tag: $TAG)..."
            npm stage publish --provenance --access public --tag "$TAG"
          else
            echo "Publishing package via OIDC Trusted Publishing (dist-tag: $TAG)..."
            npm publish --provenance --access public --tag "$TAG"
          fi
