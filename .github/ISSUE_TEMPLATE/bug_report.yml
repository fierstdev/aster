name: Bug Report
description: Report a reproducible bug in Aster
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Paste a minimal `function*` / `.tsx` snippet or repo link.
      render: tsx
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core Runtime (`@fierst/aster`)
        - JSX Compiler / Vite+ Plugin (`@fierst/aster/vite`)
        - Router (`@fierst/aster/router`)
        - SSR / Streaming / Lazy Revival (`@fierst/aster/ssr`, `@fierst/aster/revive`)
        - Astro Integration (`@fierst/aster/astro`)
        - Web Components (`defineElement`)
        - Scaffolder (`create-aster`)
        - Documentation
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Aster version, `vp --version`, OS, and browser (if applicable).
      placeholder: '@fierst/aster 1.0.0-alpha.1, vp 1.x, macOS, Chrome 145'
